name: Verify AIO reference hashes

on:
  push:
    paths:
      - "common/tools/0/default/**"
      - "tools/rebuild_reference_hashes.py"
      - ".gitattributes"
      - ".github/workflows/reference-hashes.yml"
  pull_request:
    paths:
      - "common/tools/0/default/**"
      - "tools/rebuild_reference_hashes.py"
      - ".github/workflows/reference-hashes.yml"

permissions:
  contents: read

jobs:
  reference-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify common tool hashes
        run: python3 tools/rebuild_reference_hashes.py tool-dir --check
